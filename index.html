<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grasping Straws?</title>
  <meta name="description" content="An original deck of lateral-thinking prompts for breaking creative deadlocks. Tap to draw a card.">
  <meta property="og:title" content="Grasping Straws?">
  <meta property="og:description" content="An original deck of lateral-thinking prompts for breaking creative deadlocks. Tap to draw a card.">
  <meta property="og:type" content="website">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5efe3">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171310">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/EBGaramond-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="stage">
    <button id="card" class="card" aria-describedby="draw-desc">
      <span class="card-inner" id="card-inner">
        <span class="card-mark" id="card-mark">
          <span class="glyph"></span>
          <span class="card-wordmark" data-deck-name>Grasping Straws?</span>
        </span>
        <span class="card-text" id="card-text" hidden></span>
      </span>
    </button>
    <span id="draw-desc" class="sr-only">Draws the next card from the deck.</span>
    <p class="hint" id="hint" aria-hidden="true">
      <span class="hint-touch">tap to draw</span>
      <span class="hint-pointer">press space, or click</span>
    </p>
    <p class="sr-only" aria-live="polite" id="live"></p>
    <noscript>
      <p class="hint">The deck needs JavaScript to shuffle — the cards themselves are just <a href="cards.json">a JSON file</a>.</p>
    </noscript>
  </main>
  <footer class="chrome">
    <span class="deck-name" data-deck-name>Grasping Straws?</span>
    <nav>
      <a href="about.html">About</a>
      <a href="about.html#physical" class="cta" data-physical-link>Get the physical deck</a>
    </nav>
  </footer>
</body>
</html>
