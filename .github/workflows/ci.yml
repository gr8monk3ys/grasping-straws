name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.56.1 cannot
    # install Chromium. Move this on when Playwright is bumped past that.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # validate, validate:rules, pnp:check, typecheck, unit tests, build.
      - name: Verify (checks, unit tests, build)
        run: npm run verify:check
      - name: Test-count evidence (unit)
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_summary.py unit reports/unit.xml
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Drive the built site end to end
        run: npm run verify:e2e
        env:
          SHOTS_DIR: reports/ui-evidence
      - name: Test-count evidence (e2e)
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_summary.py e2e reports/e2e.xml
      - name: Upload UI evidence (screenshots + trace)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-evidence
          path: reports/ui-evidence
          if-no-files-found: error
      - name: List UI evidence in the job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### ui-evidence artifact"
            echo
            find reports/ui-evidence -type f | sort | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
