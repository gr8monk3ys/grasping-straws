name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate cards.json
        run: npm run validate
      - name: The games on /play/ match the printed rules cards
        run: npm run validate:rules
      - name: The committed print-and-play PDF is in step with the deck
        run: npm run pnp:check
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Drive the built site end to end
        run: |
          python3 -m http.server 8317 --bind 127.0.0.1 --directory dist &> /dev/null &
          sleep 1
          node scripts/verify.js
