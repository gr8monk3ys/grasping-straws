name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # verify_summary.py writes <stage>.json here; merged by the verify-report job.
  VERIFY_STAGE_DIR: verify-stages

jobs:
  ci:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.56.1 cannot
    # install Chromium. Move this on when Playwright is bumped past that.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # validate, validate:rules, pnp:check, typecheck, unit tests, build.
      - name: Verify (checks, unit tests, build)
        run: npm run verify:check
      - name: Test-count evidence (unit)
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_summary.py unit reports/unit.xml
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Drive the built site end to end
        run: npm run verify:e2e
        env:
          SHOTS_DIR: reports/ui-evidence
      - name: Test-count evidence (e2e)
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_summary.py e2e reports/e2e.xml
      - name: Upload VERIFY stage counts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-stage-ci
          path: verify-stages/
          retention-days: 1
      - name: Upload UI evidence (screenshots + trace)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-evidence
          path: reports/ui-evidence
          if-no-files-found: error
      - name: List UI evidence in the job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### ui-evidence artifact"
            echo
            find reports/ui-evidence -type f | sort | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  verify-report:
    # Merges every job's VERIFY stage counts into one machine-readable artifact for the merge gate
    # (job summaries aren't readable via the REST API). Fails if any expected stage is missing.
    name: Verify Report
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()

    steps:
      - name: Download stage counts
        uses: actions/download-artifact@v4
        with:
          pattern: verify-stage-*
          path: verify-stages
          merge-multiple: true

      - name: Merge into verify-report.json
        env:
          EXPECTED_STAGES: unit e2e
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for s in $EXPECTED_STAGES; do
            f="verify-stages/$s.json"
            [ -f "$f" ] || { echo "::error::missing VERIFY stage '$s'"; exit 1; }
            jq -e --arg s "$s" '.stage == $s and ([.tests, .passed, .failed, .skipped] | all(type == "number" and . == floor and . >= 0))
              and (.passed_ids | type == "array" and all(type == "string"))' "$f" > /dev/null \
              || { echo "::error::unparseable VERIFY stage '$s'"; cat "$f"; exit 1; }
          done
          jq -n --arg repo "$REPO" --arg commit "$COMMIT" '{schema: 1, repo: $repo, commit: $commit, stages: [inputs | .passed_ids |= (unique | sort)]}' \
            $(for s in $EXPECTED_STAGES; do echo "verify-stages/$s.json"; done) > verify-report.json
          cat verify-report.json

      - name: Upload verify-report
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: verify-report.json
          retention-days: 30
