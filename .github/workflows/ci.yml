name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate cards.json and the rules cards
        run: npm run validate
      - name: Formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
      # Before the browser download, so a dead dev server fails fast. The
      # build and the typecheck never touch dev-only config (Vite server
      # and optimizeDeps settings), so nothing else here would notice.
      - name: Smoke-test the dev server
        run: npm run smoke
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Drive the built site end to end
        run: |
          python3 -m http.server 8317 --bind 127.0.0.1 --directory dist &> /dev/null &
          # Poll rather than sleep: a fixed wait is a coin flip on a slow runner.
          for i in $(seq 1 50); do
            curl -sf -o /dev/null http://127.0.0.1:8317/ && break
            if [ "$i" = 50 ]; then echo "server never came up on :8317"; exit 1; fi
            sleep 0.2
          done
          node scripts/verify.js
